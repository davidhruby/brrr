[package]
name = "brrr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jonhoo"
path = "src/jonhoo/main.rs"

[[bin]]
name = "david"
path = "src/david/main.rs"

[[bin]]
name = "analyze-xctrace"
path = "src/analyze/xctrace/main.rs"

[[bin]]
name = "analyze-tlb-size"
path = "src/analyze/tlb_size/main.rs"

[lib]
name = "brrr"
path = "src/david/lib.rs"

[profile.release]
lto = "fat"
debug = "full"

[dependencies]
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
serde = { version = "1.0.229", features = ["derive"] }
rustc-demangle = "0.1.28"
rand = { version = "0.10.3", features = ["thread_rng"]}
libc = "0.2.191"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
micromeasure = "0.16.0"

[[bench]]
name = "parse_temperature_criterion"
harness = false

[[bench]]
name = "parse_newline_criterion"
harness = false

[[bench]]
name = "parse_semicolon_criterion"
harness = false

[[bench]]
name = "parse_newline_and_semicolon_criterion"
harness = false

[[bench]]
name = "parse_temperature_micromeasure"
harness = false